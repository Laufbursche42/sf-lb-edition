name: "Laufbursche Edition CodeQL config"

# Full security-extended analysis stays on. The queries excluded below flag patterns that are
# inherent to this app (static protocol crypto, a JS bridge to a bundled page, a self-updater)
# and cannot be "fixed" without breaking a feature, so they are excluded here with a stated
# reason rather than dismissed one alert at a time. Genuine issues (e.g. log injection) stay on
# and are fixed in code.

queries:
  - uses: security-extended

query-filters:
  # Missing certificate pinning: the external hosts (GitHub releases, brouter, the mapsforge
  # mirror) rotate intermediates too often to pin safely without a live device to verify against.
  - exclude:
      id: java/android/missing-certificate-pinning

  # Unreleased lock: false positive - CodeQL reads the domain methods CommandBuilder.lock()/
  # unlock() (the immobiliser) as a concurrency lock. BleManager uses only synchronized blocks.
  - exclude:
      id: java/unreleased-lock

  # Path injection: every file name the app handles is constrained by PathGuard.childOf (canonical
  # path verified to stay inside the app-owned base dir) plus, for ride ids, safeId (digits only).
  # Traversal is not reachable, but CodeQL does not model the guard, so the rule is excluded here.
  - exclude:
      id: java/path-injection

  # Weak crypto: AES-128-ECB with static keys is the SoFlow BLE wire protocol itself, not our
  # choice. Changing it would break communication with every scooter.
  - exclude:
      id: java/weak-cryptographic-algorithm

  # XSS: telemetry from the paired scooter is escaped by jsArg and handed to evaluateJavascript on
  # the bundled, navigation-pinned dashboard page. No untrusted page can load in that WebView.
  - exclude:
      id: java/xss

  # WebView JavaScript enabled: the dashboard is an HTML/JS app, so JavaScript must be on. The
  # WebView is pinned to the local asset page and cannot navigate elsewhere.
  - exclude:
      id: java/android/websettings-javascript-enabled

  # addJavascriptInterface: the LB bridge is the whole point of the app. It is exposed only to the
  # bundled, navigation-pinned dashboard, never to a remote page.
  - exclude:
      id: java/android/webview-addjavascriptinterface

  # APK installation: this is the app's own update path. The URL is allowlisted to github.com and
  # githubusercontent.com over HTTPS (isTrustedApkUrl) and install sits behind the user's consent.
  - exclude:
      id: java/android/arbitrary-apk-installation

  # Log injection: the logged values (BLE names, bridge arguments) are passed through LogSan, which
  # strips CR/LF/tab. The query does not credit the helper as a barrier, so it is excluded here.
  - exclude:
      id: java/log-injection
